name: paper-strong-mechanism-checks

on:
  push:
    branches:
      - paper/strong-mechanism-safety-persistence
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'paper/strong_mechanism/**'
      - '.github/workflows/paper-strong-mechanism-checks.yml'
      - 'experiments/step2_mechanism_dynamics/scripts/train_lora_with_checkpoints.py'
      - 'experiments/step2_mechanism_dynamics/scripts/evaluate_checkpoint_dynamics.py'
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'paper/strong_mechanism/**'
      - '.github/workflows/paper-strong-mechanism-checks.yml'

permissions:
  contents: read

jobs:
  generate-available-figures:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged branch documentation bundle when present
        shell: bash
        run: |
          parts_dir='.paper_a_bootstrap/parts'
          if compgen -G "${parts_dir}/part*" > /dev/null; then
            cat "${parts_dir}"/part* | base64 --decode > /tmp/paper_a_update.tar.gz
            echo '6ca774dab3c2ec6d1ba5053b75a1ad2a46da628f2f682a829a29ed8336d046dd  /tmp/paper_a_update.tar.gz' | sha256sum -c -
            tar -xzf /tmp/paper_a_update.tar.gz -C .
            rm -rf .paper_a_bootstrap /tmp/paper_a_update.tar.gz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install figure dependencies
        run: python -m pip install -r paper/strong_mechanism/requirements-paper.txt
      - name: Render tracked available SVG assets
        run: |
          python paper/strong_mechanism/scripts/plot_available_figures.py \
            --output-dir paper/strong_mechanism/figures/available \
            --formats svg
      - name: Commit regenerated branch assets when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Paper A branch assets are already current."
          else
            git commit -m "论文A：完善说明、协作规则与当前可用图表"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install paper dependencies
        run: python -m pip install -r paper/strong_mechanism/requirements-paper.txt
      - name: Compile all paper Python sources
        run: python -m compileall -q paper/strong_mechanism/scripts paper/strong_mechanism/tests
      - name: Validate study registry and pinned sources
        run: python paper/strong_mechanism/scripts/validate_study.py
      - name: Validate model and environment pins without model download
        run: |
          python paper/strong_mechanism/scripts/prepare_runtime_config.py \
            --config paper/strong_mechanism/configs/qwen3_4b_equal_dose_temporal_schedules.json \
            --output /tmp/paper_a_equal_dose_runtime.json \
            --validate-only
          python paper/strong_mechanism/scripts/prepare_runtime_config.py \
            --config paper/strong_mechanism/configs/qwen3_4b_context_replication.json \
            --output /tmp/paper_a_context_runtime.json \
            --validate-only
      - name: Run paper tests and artifact-pipeline smoke test
        run: python -m unittest discover -s paper/strong_mechanism/tests -p 'test_*.py'
      - name: Render formal command manifests
        run: |
          python paper/strong_mechanism/scripts/render_run_commands.py \
            --output /tmp/paper_a_run_commands.txt \
            --manifest /tmp/paper_a_run_commands.json
          grep -q '^# command_count=15$' /tmp/paper_a_run_commands.txt
          python paper/strong_mechanism/scripts/render_evaluation_commands.py \
            --output /tmp/paper_a_evaluation_commands.txt \
            --manifest /tmp/paper_a_evaluation_commands.json
          grep -q '^# command_count=45$' /tmp/paper_a_evaluation_commands.txt
      - name: Generate every currently legal figure asset
        run: |
          rm -rf /tmp/paper_a_available_figures
          python paper/strong_mechanism/scripts/plot_available_figures.py \
            --output-dir /tmp/paper_a_available_figures \
            --formats svg
          test "$(find /tmp/paper_a_available_figures -maxdepth 1 -name '*.svg' | wc -l)" -eq 9
          for file in \
            fig00_paper_story.svg \
            fig01_equal_dose_design.svg \
            fig02_evidence_pipeline.svg \
            fig03_data_boundaries.svg \
            fig10_historical_subspace_signature.svg \
            fig11_historical_posthoc_control_failure.svg \
            fig12_historical_sequence_anchor_multiseed.svg \
            fig13_historical_seed1_persistence_context.svg \
            fig20_completion_gates.svg; do
            test -s "/tmp/paper_a_available_figures/${file}"
          done

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            lmodern \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra
      - name: Compile evidence-gated manuscript
        run: make -C paper/strong_mechanism/latex check
