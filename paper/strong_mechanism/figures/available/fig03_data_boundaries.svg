   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="14.688243" y="27" transform="rotate(-0 14.688243 27)">Data roles and leakage boundaries</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="14.688243" y="50.76" transform="rotate(-0 14.688243 50.76)">Training targets, development evaluation, confirmation, and the global heldout retain different roles.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="35.168588" y="128.054438" transform="rotate(-0 35.168588 128.054438)">Safety training pool</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(35.168588 153.343773)">40 prompt IDs</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(35.168588 164.547344)">80 frozen natural targets</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(35.168588 173.2165)"/>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(35.168588 186.797344)">Used only for sequence-level</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(35.168588 197.922344)">safety replay and exposure audits.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="229.862906" y="128.054438" transform="rotate(-0 229.862906 128.054438)">Core100 development</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(229.862906 153.422344)">100 safety prompts</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(229.862906 162.0915)"/>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(229.862906 175.672344)">Used for trajectory analysis,</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(229.862906 186.797344)">mechanism development and</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(229.862906 197.922344)">candidate comparison.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="424.295135" y="128.054438" transform="rotate(-0 424.295135 128.054438)">Paper-A confirmation</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(424.295135 153.422344)">New prompt-disjoint panel</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(424.295135 164.547344)">Size frozen prospectively</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(424.295135 173.2165)"/>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(424.295135 186.797344)">Opened exactly once after</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(424.295135 197.922344)">analysis and decision freeze.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="610.714945" y="128.054438" transform="rotate(-0 610.714945 128.054438)">Global heldout</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(610.714945 154.008164)">120 rows</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(610.714945 161.7165)"/>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(610.714945 175.834969)">Remains reserved for the</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(610.714945 185.867156)">future method paper unless a</text>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(610.714945 196.742156)">separate decision changes it.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #667085" x="198.150196" y="240.826172" transform="rotate(-0 198.150196 240.826172)">no prompt reuse</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #667085" x="392.844515" y="240.826172" transform="rotate(-0 392.844515 240.826172)">no prompt reuse</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #667085" x="580.05059" y="240.826172" transform="rotate(-0 580.05059 240.826172)">no prompt reuse</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="149.476617" y="314.1" transform="rotate(-0 149.476617 314.1)">Separate benign utility stream</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="149.476617" y="333.9" transform="rotate(-0 149.476617 333.9)">Utility100 is evaluated independently from the safety–quality frontier; utility is never hidden inside a composite safety score.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="149.476617" y="351.72" transform="rotate(-0 149.476617 351.72)">Primary output tables contain source hashes, opaque review IDs, arm/seed/checkpoint metadata, and prompt-paired joins.</text>
   </g>
  </g>
 </g>
