   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="15.349779" y="24.084" transform="rotate(-0 15.349779 24.084)">Paper A: from diagnostic structure to a falsifiable persistence mechanism</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667085" x="15.349779" y="48.204" transform="rotate(-0 15.349779 48.204)">Mechanism and measurement study; no candidate is presented as a validated new method.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="51.779291" y="121.457078" transform="rotate(-0 51.779291 121.457078)">1. Diagnostic geometry</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 147.979785)">Risk LoRA shows reproducible</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 159.479785)">output-side structure.</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 168.44116)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 182.479785)">Simple spectral and post-hoc controls</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 194.871035)">do not recover behavior.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="459.268241" y="121.457078" transform="rotate(-0 459.268241 121.457078)">2. Behavior-aligned signal</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 147.979785)">Sequence-level safety replay</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 159.479785)">changes unsafe behavior.</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 168.44116)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 182.479785)">Scalar margins and tested local</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 193.979785)">proxies are behaviorally insufficient.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="51.779291" y="278.237077" transform="rotate(-0 51.779291 278.237077)">3. Persistence–quality tension</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 304.759785)">Late safety contribution may</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 317.151035)">control unsafe rebound.</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 325.22116)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 339.259785)">Persistent supervision can narrow</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(51.779291 350.759785)">prompt coverage and response quality.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="459.268241" y="278.237077" transform="rotate(-0 459.268241 278.237077)">4. Confirmatory mechanism test</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 304.759785)">Equal cumulative safety dose;</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 316.259785)">only temporal placement changes.</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 325.22116)"/>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 339.259785)">Three seeds, prompt-paired labels,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 350.759785)">human validity, second setting,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #243447" transform="translate(459.268241 362.259785)">and one sealed confirmation panel.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243447" x="60.173564" y="431.898047" transform="rotate(-0 60.173564 431.898047)">Current evidence state</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #667085" transform="translate(215.019364 426.271045)">Historical mechanism evidence exists; formal equal-dose results, final blinded quality measurement, human validity, second-setting replication, and</text>
    <text style="font-size: 8.9px; font-family: 'DejaVu Sans'; fill: #667085" transform="translate(215.019364 436.953479)">confirmation remain pending.</text>
   </g>
  </g>
 </g>
